<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | DLCF 2026</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .action-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn-action { background-color: var(--secondary); color: #333; flex: 1; min-width: 150px; margin-top: 0;}
        .btn-action:hover { background-color: #d1b84b; }
        .btn-word { background-color: #2b579a; color: white; flex: 1; min-width: 150px; margin-top: 0;} /* Word Blue */
        .btn-logout { background-color: #333; color: white; flex: 1; min-width: 150px; margin-top: 0;}
        .commission-header { background-color: #f1f1f1; padding: 10px; border-radius: 4px; margin-bottom: 15px; border-left: 4px solid var(--primary); }
        .commission-header h4 { margin: 0; color: #333; }
        .perf-badge { float: right; background: var(--primary); color: white; padding: 5px 10px; border-radius: 5px; font-weight: bold;}
    </style>
</head>
<body>
    <header>
        <h1>Admin Dashboard</h1>
        <p>Live Feedback from Sectional Heads</p>
    </header>

    <div class="container">
        <div class="action-bar">
            <button class="btn-action" onclick="downloadExcel()">📊 Download Excel</button>
            <button class="btn-word" onclick="downloadWord()">📝 Download MS Word</button>
            <button class="btn-logout" onclick="logout()">🚪 Logout</button>
        </div>

        <div id="loading">Loading reports...</div>
        <div id="reportsContainer"></div>
    </div>

    <script>
        let allReports = [];

        async function loadReports() {
            try {
                const response = await fetch('/api/reports');
                if (!response.ok) throw new Error('Unauthorized');
                
                allReports = await response.json();
                const container = document.getElementById('reportsContainer');
                document.getElementById('loading').style.display = 'none';

                allReports.forEach(report => {
                    const card = document.createElement('div');
                    card.className = 'report-card';
                    card.innerHTML = `
                        <div class="commission-header">
                            <h4>${report.commissionHeads}</h4>
                        </div>
                        <span class="perf-badge">Performance: ${report.performance}/10</span>
                        <span class="badge">${report.date}</span>
                        <span class="badge" style="background: #333; color: white;">${report.section}</span>
                        <h3>Leader: ${report.leader}</h3>
                        <p><strong>Team Members:</strong> ${report.team}</p>
                        <p><strong>Preparations:</strong><br>${report.preparations}</p>
                        <p><strong>Activities:</strong><br>${report.activities}</p>
                        <p><strong>Challenges:</strong><br>${report.challenges}</p>
                        <p><strong>Suggestions:</strong><br>${report.suggestions}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                document.getElementById('loading').innerText = "Access Denied.";
            }
        }

        // Export to MS Word (Perfectly arranged Table)
        function downloadWord() {
            let html = `
            <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head><meta charset='utf-8'><style>
                table { border-collapse: collapse; width: 100%; table-layout: fixed; }
                th, td { border: 1px solid black; padding: 5px; font-family: Arial; font-size: 10pt; word-wrap: break-word; vertical-align: top; }
                th { background-color: #E54F00; color: white; }
                h2 { color: #E54F00; text-align: center; font-family: Arial;}
            </style></head><body>
            <h2>DLCF 2026: Comprehensive Reports</h2>
            <table>
                <tr>
                    <th width="8%">Date</th><th width="12%">Commission</th><th width="10%">Section & Leader</th>
                    <th width="10%">Team</th><th width="15%">Preparations</th><th width="15%">Activities</th>
                    <th width="15%">Challenges</th><th width="5%">Perf.</th><th width="10%">Suggestions</th>
                </tr>`;

            allReports.forEach(r => {
                html += `<tr>
                    <td>${r.date}</td><td>${r.commissionHeads}</td><td><b>${r.section}</b><br>${r.leader}</td>
                    <td>${r.team}</td><td>${r.preparations}</td><td>${r.activities}</td>
                    <td>${r.challenges}</td><td>${r.performance}/10</td><td>${r.suggestions}</td>
                </tr>`;
            });
            html += `</table></body></html>`;

            const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `DLCF_Reports_${new Date().toLocaleDateString('en-GB').replace(/\//g, '-')}.doc`;
            link.click();
        }

        // Export to Excel (CSV)
        function downloadExcel() {
            let csv = "Date,Commission,Section,Leader,Team,Preparations,Activities,Challenges,Performance,Suggestions\n";
            allReports.forEach(r => {
                const row = [
                    `"${r.date}"`, `"${r.commissionHeads}"`, `"${r.section}"`, `"${r.leader}"`, `"${r.team.replace(/"/g, '""')}"`,
                    `"${r.preparations.replace(/"/g, '""')}"`, `"${r.activities.replace(/"/g, '""')}"`,
                    `"${r.challenges.replace(/"/g, '""')}"`, `"${r.performance}"`, `"${r.suggestions.replace(/"/g, '""')}"`
                ].join(",");
                csv += row + "\n";
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `DLCF_Reports.csv`;
            link.click();
        }

        function logout() {
            fetch('/api/reports', { headers: { 'Authorization': 'Basic ' + btoa('logout:logout') } })
            .then(() => window.location.href = '/')
            .catch(() => window.location.href = '/');
        }

        window.onload = loadReports;
    </script>
</body>
</html>
